name: Release Linux Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            zig_target: x86_64-linux-gnu
            dpkg_arch: amd64
          - arch: arm64
            zig_target: aarch64-linux-gnu
            dpkg_arch: arm64
          - arch: armhf
            zig_target: arm-linux-gnueabihf
            dpkg_arch: armhf

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch == 'arm64' && 'aarch64' || 'arm' }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            zlib1g-dev \
            libbz2-dev \
            libonig-dev

      - name: Build binary
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dpie=true \
            -Dtarget=${{ matrix.zig_target }} \
            || zig build -Doptimize=ReleaseFast -Dpie=true

      - name: Create .deb package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG_DIR="ghostty_${VERSION}_${{ matrix.dpkg_arch }}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/metainfo"
          mkdir -p "${PKG_DIR}/usr/share/ghostty"
          mkdir -p "${PKG_DIR}/usr/lib/systemd/user"
          mkdir -p "${PKG_DIR}/usr/share/dbus-1/services"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"

          # Binary
          cp zig-out/bin/ghostty "${PKG_DIR}/usr/bin/" || cp zig-out/bin/ghostty "${PKG_DIR}/usr/bin/"
          chmod 755 "${PKG_DIR}/usr/bin/ghostty"

          # Desktop file
          cp dist/linux/app.desktop.in "${PKG_DIR}/usr/share/applications/com.mitchellh.ghostty.desktop"

          # Metainfo
          cp dist/linux/com.mitchellh.ghostty.metainfo.xml.in "${PKG_DIR}/usr/share/metainfo/com.mitchellh.ghostty.metainfo.xml"

          # Resources
          cp -r zig-out/share/ghostty/* "${PKG_DIR}/usr/share/ghostty/" 2>/dev/null || true

          # Systemd service
          cp dist/linux/systemd.service.in "${PKG_DIR}/usr/lib/systemd/user/ghostty.service" 2>/dev/null || true

          # D-Bus service
          cp dist/linux/dbus.service.in "${PKG_DIR}/usr/share/dbus-1/services/com.mitchellh.ghostty.service" 2>/dev/null || true

          # Icon
          cp images/icons/icon_128x128.png "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps/com.mitchellh.ghostty.png" 2>/dev/null || true

          # Control file
          INSTALLED_SIZE=$(du -sk "${PKG_DIR}" | cut -f1)
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: ghostty
          Version: ${VERSION}
          Architecture: ${{ matrix.dpkg_arch }}
          Maintainer: Ghostty Maintainers <maintainers@ghostty.org>
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libgtk-4-1, libadwaita-1-0, libfontconfig1, libfreetype6, libharfbuzz0b, libpng16-16, zlib1g
          Section: x11
          Priority: optional
          Homepage: https://ghostty.org
          Description: A fast, feature-rich, and cross-platform terminal emulator
           Ghostty is a terminal emulator that differentiates itself by being designed
           for high-throughput and low-latency while still having a rich feature set
           including a GPU-accelerated renderer, a rich configuration system, and
           platform-native UI elements.
          EOF

          dpkg-deb --build "${PKG_DIR}"
          mv "${PKG_DIR}.deb" "ghostty_${VERSION}_${{ matrix.dpkg_arch }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.dpkg_arch }}
          path: "*.deb"
          retention-days: 5

  build-rpm:
    name: Build .rpm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            zig_target: x86_64-linux-gnu
            rpm_arch: x86_64
          - arch: aarch64
            zig_target: aarch64-linux-gnu
            rpm_arch: aarch64
          - arch: armv7hl
            zig_target: arm-linux-gnueabihf
            rpm_arch: armv7hl
    container:
      image: fedora:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Zig
        run: |
          dnf install -y xz
          ZIG_VERSION="0.14.0"
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
          mv zig-linux-x86_64-${ZIG_VERSION} /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          dnf install -y \
            pkg-config \
            gtk4-devel \
            libadwaita-devel \
            fontconfig-devel \
            freetype-devel \
            harfbuzz-devel \
            libpng-devel \
            zlib-devel \
            bzip2-devel \
            oniguruma-devel \
            rpm-build \
            git

      - name: Build binary
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dpie=true \
            -Dtarget=${{ matrix.zig_target }} \
            || zig build -Doptimize=ReleaseFast -Dpie=true

      - name: Build RPM
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          sed "s/%{version}/${VERSION}/g" packaging/rpm/ghostty.spec > ~/rpmbuild/SPECS/ghostty.spec

          BUILDROOT=~/rpmbuild/BUILDROOT/ghostty-${VERSION}-1.$(. /etc/os-release && echo $ID).${{ matrix.rpm_arch }}
          mkdir -p "${BUILDROOT}/usr/bin"
          mkdir -p "${BUILDROOT}/usr/share/applications"
          mkdir -p "${BUILDROOT}/usr/share/metainfo"
          mkdir -p "${BUILDROOT}/usr/share/ghostty"
          mkdir -p "${BUILDROOT}/usr/lib/systemd/user"
          mkdir -p "${BUILDROOT}/usr/share/dbus-1/services"
          mkdir -p "${BUILDROOT}/usr/share/licenses/ghostty"
          mkdir -p "${BUILDROOT}/usr/share/doc/ghostty"

          cp zig-out/bin/ghostty "${BUILDROOT}/usr/bin/"
          cp dist/linux/app.desktop.in "${BUILDROOT}/usr/share/applications/com.mitchellh.ghostty.desktop"
          cp dist/linux/com.mitchellh.ghostty.metainfo.xml.in "${BUILDROOT}/usr/share/metainfo/com.mitchellh.ghostty.metainfo.xml"
          cp -r zig-out/share/ghostty/* "${BUILDROOT}/usr/share/ghostty/" 2>/dev/null || true
          cp dist/linux/systemd.service.in "${BUILDROOT}/usr/lib/systemd/user/ghostty.service" 2>/dev/null || true
          cp dist/linux/dbus.service.in "${BUILDROOT}/usr/share/dbus-1/services/com.mitchellh.ghostty.service" 2>/dev/null || true
          cp LICENSE "${BUILDROOT}/usr/share/licenses/ghostty/"
          cp README.md "${BUILDROOT}/usr/share/doc/ghostty/"

          rpmbuild -bb --target ${{ matrix.rpm_arch }} \
            --define "_topdir $HOME/rpmbuild" \
            --buildroot "${BUILDROOT}" \
            ~/rpmbuild/SPECS/ghostty.spec

          cp ~/rpmbuild/RPMS/${{ matrix.rpm_arch }}/*.rpm .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"
          retention-days: 5

  build-arch:
    name: Build .pkg.tar.zst (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            zig_target: x86_64-linux-gnu
          - arch: aarch64
            zig_target: aarch64-linux-gnu
          - arch: armv7h
            zig_target: arm-linux-gnueabihf
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            zig \
            pkg-config \
            gtk4 \
            libadwaita \
            fontconfig \
            freetype2 \
            harfbuzz \
            libpng \
            zlib \
            bzip2 \
            oniguruma \
            git

      - name: Build package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          useradd -m builder
          chown -R builder:builder .

          cd packaging/arch
          cat > PKGBUILD << PKGBUILD_EOF
          pkgname=ghostty
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A fast, feature-rich, and cross-platform terminal emulator"
          arch=('x86_64' 'aarch64' 'armv7h')
          url="https://ghostty.org"
          license=('MIT')
          depends=('gtk4' 'libadwaita' 'fontconfig' 'freetype2' 'harfbuzz' 'libpng' 'zlib')
          makedepends=('zig' 'pkg-config' 'git')

          build() {
              cd "\${startdir}/../.."
              zig build -Doptimize=ReleaseFast -Dpie=true
          }

          package() {
              cd "\${startdir}/../.."
              install -Dm755 "zig-out/bin/ghostty" "\$pkgdir/usr/bin/ghostty"
              install -Dm644 "dist/linux/app.desktop.in" "\$pkgdir/usr/share/applications/com.mitchellh.ghostty.desktop"
              install -Dm644 "dist/linux/com.mitchellh.ghostty.metainfo.xml.in" "\$pkgdir/usr/share/metainfo/com.mitchellh.ghostty.metainfo.xml"
              mkdir -p "\$pkgdir/usr/share/ghostty"
              cp -r zig-out/share/ghostty/* "\$pkgdir/usr/share/ghostty/" 2>/dev/null || true
              install -Dm644 "dist/linux/systemd.service.in" "\$pkgdir/usr/lib/systemd/user/ghostty.service" 2>/dev/null || true
              install -Dm644 "dist/linux/dbus.service.in" "\$pkgdir/usr/share/dbus-1/services/com.mitchellh.ghostty.service" 2>/dev/null || true
              install -Dm644 "LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
          }
          PKGBUILD_EOF

          chown -R builder:builder .
          su builder -c "makepkg -sf --noconfirm --skipinteg"
          cp *.pkg.tar.zst ../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.arch }}
          path: "*.pkg.tar.zst"
          retention-days: 5

  publish-release:
    name: Upload release artifacts
    needs: [build-deb, build-rpm, build-arch]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Collect and checksum
        run: |
          cd artifacts
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" \) -exec cp {} ../ \;
          cd ..
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst
            SHA256SUMS.txt
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
