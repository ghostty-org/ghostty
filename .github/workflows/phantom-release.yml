name: Phantom Release

# Phantom-only release pipeline — separate from release-tag.yml (Ghostty's
# own, untouched, using infrastructure this fork has no access to: paid
# Namespace runners, Nix, a real Developer ID cert, Sparkle/appcast, R2).
# This builds, ad-hoc signs, packages and publishes a Phantom.dmg to this
# repo's own Releases page on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: git rev-list --count and git tag -l both need it.
          fetch-depth: 0

      # The version comes from build.zig.zon, never from arithmetic over
      # existing tags.
      #
      # It used to take the highest `v*.*.*` and add one, which quietly
      # counted **Ghostty's** tags — this fork inherited v1.3.2 through
      # v1.3.4 — and so tagged our own merge v1.3.5 while build.zig.zon
      # still said 1.3.2-dev. The build refuses a tag that disagrees with
      # that file ("tagged releases must be in vX.Y.Z format matching
      # build.zig"), so main became unbuildable for anyone whose HEAD
      # landed on the tag. Reading the one file that declares the version
      # makes the two unable to drift.
      - name: Compute version
        id: version
        run: |
          VERSION=$(grep -m1 '\.version' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION=${VERSION%-dev}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build.zig.zon version '$VERSION' is not X.Y.Z" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists — bump .version in build.zig.zon" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Set version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.short_version }}" zig-out/Phantom.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" zig-out/Phantom.app/Contents/Info.plist

      - name: Codesign (ad-hoc)
        run: |
          codesign --force --deep --sign - \
            --entitlements macos/GhosttyReleaseLocal.entitlements \
            zig-out/Phantom.app

      - name: Create DMG
        run: |
          npm install --global create-dmg
          # create-dmg's exit code isn't reliable even on success; the real
          # check is whether the file landed.
          create-dmg zig-out/Phantom.app . || true
          mv Phantom*.dmg Phantom.dmg
          test -f Phantom.dmg

      - name: Tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title ${{ steps.version.outputs.tag }} \
            --generate-notes \
            --notes 'Ad-hoc signed, not notarized — on first launch, right-click the app and choose **Open** (or run `xattr -cr Phantom.app` after unzipping) instead of double-clicking, or Gatekeeper will refuse it as from an unidentified developer.' \
            Phantom.dmg
