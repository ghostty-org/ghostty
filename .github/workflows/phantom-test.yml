name: Phantom Test

# Phantom-only CI — separate from test.yml (Ghostty's own, untouched aside
# from one runner-label fix on its "required" gate job). test.yml's real
# work already skips itself on forks (most jobs gate on
# `github.repository == 'ghostty-org/ghostty'`), so it's harmless noise here,
# not something to replicate. This runs the checks that actually matter for
# this fork, on runners this fork actually has: the Zig core test suite,
# the macOS build, the Swift regression suite, and formatting.
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: zig fmt --check .

  # zig build test itself invokes `xcodebuild test -scheme Ghostty` as part
  # of its own dependency graph (see GhosttyXcodebuild.zig) — this already
  # covers the Swift regression suite, so build-macos below doesn't repeat
  # it via a second, redundant xcodebuild test invocation.
  zig-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - run: zig build test -Dapp-runtime=none

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --strict macos/Sources

      - name: Build
        run: zig build -Doptimize=ReleaseFast
