on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

name: Test

# We only want the latest commit to test for any non-main ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Determines whether other jobs should be skipped. Modify this if there
  # are other fast skip conditions, and add it as an output. Then modify
  # other tests `needs/if` to check them. Document the outputs.
  skip:
    if: github.repository == 'ghostty-org/ghostty'
    runs-on: namespace-profile-ghostty-xsm
    outputs:
      # 'true' when all changed files are non-code (e.g. only VOUCHED.td),
      # signaling that all other jobs can be skipped entirely.
      skip: ${{ steps.determine.outputs.skip }}
      # Path-based filters to gate specific linter/formatter jobs.
      actions_pins: ${{ steps.filter_any.outputs.actions_pins }}
      blueprints: ${{ steps.filter_any.outputs.blueprints }}
      macos: ${{ steps.filter_any.outputs.macos }}
      nix: ${{ steps.filter_any.outputs.nix }}
      shell: ${{ steps.filter_any.outputs.shell }}
      zig: ${{ steps.filter_any.outputs.zig }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter_every
        with:
          token: ""
          predicate-quantifier: "every"
          filters: |
            code:
              - '**'
              - '!.github/VOUCHED.td'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter_any
        with:
          token: ""
          filters: |
            macos:
              - '.swiftlint.yml'
              - 'macos/**'
            actions_pins:
              - '.github/workflows/**'
              - '.github/pinact.yml'
            shell:
              - '**/*.sh'
              - '**/*.bash'
            nix:
              - 'nix/**'
              - '*.nix'
              - 'flake.nix'
              - 'flake.lock'
              - 'default.nix'
              - 'shell.nix'
            zig:
              - '**/*.zig'
              - 'build.zig*'
            blueprints:
              - 'src/apprt/gtk/**/*.blp'
              - 'nix/build-support/check-blueprints.sh'

      - id: determine
        name: Determine skip
        run: |
          if [ "${{ steps.filter_every.outputs.code }}" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  required:
    name: "Required Checks: Test"
    if: always()
    runs-on: namespace-profile-ghostty-xsm
    needs:
      - skip
      - build-gate
      - build-bench
      - build-dist
      - build-dist-lib-vt
      - build-example-zig-vt-macos-no-sdk
      - build-examples-zig
      - build-examples-cmake
      - build-examples-cmake-windows
      - build-examples-swift
      - build-cmake
      - build-flatpak
      - build-libghostty-vt
      - build-libghostty-vt-freestanding
      - build-libghostty-vt-wasm
      - build-libghostty-vt-features
      - build-libghostty-vt-android
      - build-libghostty-vt-macos
      - build-libghostty-vt-windows
      - build-linux
      - build-linux-libghostty
      - build-nix-ghostty
      - build-nix-lib-vt
      # - build-nix-macos
      - build-macos
      - build-macos-xcode-27
      - build-macos-freetype
      - build-snap
      - test
      - test-simd
      - test-gtk
      - test-sentry-linux
      - test-i18n
      - test-fuzz-libghostty
      - test-kaitai
      - test-lib-vt
      - test-lib-vt-freebsd
      - test-lib-vt-pkgconfig
      - test-macos
      - pinact
      - prettier
      - swiftlint
      - alejandra
      - typos
      - shellcheck
      - translations
      - blueprint-compiler
      - test-pkg-linux
      - test-debian-13
      - test-dist
      - valgrind
      - zig-fmt

    steps:
      - id: status
        name: Determine status
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            result="failed"
          else
            result="success"
          fi
          {
            echo "result=${result}"
            echo "results=${results}"
          } | tee -a "$GITHUB_OUTPUT"
      - if: always() && steps.status.outputs.result != 'success'
        name: Check for failed status
        run: |
          echo "One or more required build workflows failed: ${{ steps.status.outputs.results }}"
          exit 1

  build-bench:
    # We build benchmarks on large because it uses fast mode
    runs-on: namespace-profile-ghostty-lg
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Benchmarks
        run: nix develop -c zig build -Demit-bench

  list-examples:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-xsm
    outputs:
      zig: ${{ steps.list.outputs.zig }}
      cmake: ${{ steps.list.outputs.cmake }}
      swift: ${{ steps.list.outputs.swift }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: List example directories
        run: |
          zig=$(ls example/*/build.zig.zon 2>/dev/null | xargs -n1 dirname | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "$zig" | jq .
          echo "zig=$zig" >> "$GITHUB_OUTPUT"
          cmake=$(ls example/*/CMakeLists.txt 2>/dev/null | xargs -n1 dirname | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "$cmake" | jq .
          echo "cmake=$cmake" >> "$GITHUB_OUTPUT"
          swift=$(ls example/*/Package.swift 2>/dev/null | xargs -n1 dirname | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "$swift" | jq .
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  build-examples-zig:
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list-examples.outputs.zig) }}
    name: Example ${{ matrix.dir }}
    runs-on: namespace-profile-ghostty-xsm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: [skip, list-examples]
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Example
        run: |
          cd example/${{ matrix.dir }}
          nix develop -c zig build

  build-example-zig-vt-macos-no-sdk:
    name: Example zig-vt (macOS, no SDK)
    runs-on: namespace-profile-ghostty-macos-golden
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /Users/runner/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /Users/runner/zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: |
            xcode
          path: |
            /Users/runner/zig

      # TODO(tahoe): https://github.com/NixOS/nix/issues/13342
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Example without SDK
        working-directory: example/zig-vt
        run: nix develop -c env DEVELOPER_DIR=/nonexistent zig build

  build-examples-cmake:
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list-examples.outputs.cmake) }}
    name: Example ${{ matrix.dir }}
    runs-on: namespace-profile-ghostty-xsm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: [skip, list-examples]
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Example
        run: |
          cd example/${{ matrix.dir }}
          nix develop -c cmake -B build -DFETCHCONTENT_SOURCE_DIR_GHOSTTY=${{ github.workspace }}
          nix develop -c cmake --build build

  build-examples-cmake-windows:
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list-examples.outputs.cmake) }}
        exclude:
          # Cross-compilation with zig cc requires a single-config
          # generator (Makefiles/Ninja). The Windows CI uses Visual
          # Studio which always uses MSVC and ignores CMAKE_C_COMPILER.
          - dir: c-vt-cmake-cross
    name: Example ${{ matrix.dir }} (Windows)
    runs-on: namespace-profile-ghostty-windows
    timeout-minutes: 45
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: [skip, list-examples]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Build Example
        shell: pwsh
        run: |
          cd example/${{ matrix.dir }}
          cmake -B build -DFETCHCONTENT_SOURCE_DIR_GHOSTTY=${{ github.workspace }}
          cmake --build build

  build-examples-swift:
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.list-examples.outputs.swift) }}
    name: Example ${{ matrix.dir }}
    runs-on: namespace-profile-ghostty-macos-golden
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: [skip, list-examples]
    env:
      ZIG_LOCAL_CACHE_DIR: /Users/runner/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /Users/runner/zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: |
            xcode
          path: |
            /Users/runner/zig

      # TODO(tahoe): https://github.com/NixOS/nix/issues/13342
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Xcode Select
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Build XCFramework
        run: nix develop -c zig build -Demit-lib-vt

      - name: Verify XCFramework artifact
        run: test -f zig-out/lib/ghostty-vt.xcframework/Info.plist

      - name: Build and Run Example
        run: |
          cd example/${{ matrix.dir }}
          swift run

  build-cmake:
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build
        run: |
          nix develop -c cmake -B build
          nix develop -c cmake --build build

      - name: Verify artifacts
        run: |
          test -f zig-out/lib/libghostty-vt.so.0.1.0
          test -d zig-out/include/ghostty
          ls -la zig-out/lib/
          ls -la zig-out/include/ghostty/

  test-lib-vt-pkgconfig:
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build libghostty-vt
        run: nix develop -c zig build -Demit-lib-vt

      - name: Verify pkg-config file
        run: |
          export PKG_CONFIG_PATH="$PWD/zig-out/share/pkgconfig"
          pkg-config --validate libghostty-vt
          echo "Cflags: $(pkg-config --cflags libghostty-vt)"
          echo "Libs:   $(pkg-config --libs libghostty-vt)"
          echo "Static: $(pkg-config --libs --static libghostty-vt)"

          # Libs.private must NOT include the C++ runtime libraries (all
          # vendored C++ deps are built in no-libcxx mode).
          ! pkg-config --libs --static libghostty-vt | grep -qE -- '-lc\+\+|-lc\+\+abi'

      - name: Verify shared library has no libc++ dependency
        run: |
          ldd zig-out/lib/libghostty-vt.so.0.1.0
          ! ldd zig-out/lib/libghostty-vt.so.0.1.0 2>/dev/null | grep -qE 'libc\+\+|libc\+\+abi'

      - name: Verify static archive contains SIMD deps
        run: |
          nm -g zig-out/lib/libghostty-vt.a | grep -q ' T .*simdutf'
          nm -g zig-out/lib/libghostty-vt.a | grep -q ' T .*3hwy'

      - name: Write test program
        run: |
          cat > /tmp/test_libghostty_vt.c << 'TESTEOF'
          #include <ghostty/vt.h>
          #include <stdio.h>
          int main(void) {
              bool simd = false;
              GhosttyResult r = ghostty_build_info(GHOSTTY_BUILD_INFO_SIMD, &simd);
              if (r != GHOSTTY_SUCCESS) return 1;
              printf("SIMD: %s\n", simd ? "yes" : "no");
              return 0;
          }
          TESTEOF

      - name: Test shared link via pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/zig-out/share/pkgconfig"
          nix develop -c cc -o /tmp/test_shared /tmp/test_libghostty_vt.c \
            $(pkg-config --cflags --libs libghostty-vt) \
            -Wl,-rpath,"$PWD/zig-out/lib"
          /tmp/test_shared

      - name: Test static link via pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/zig-out/share/pkgconfig"
          # The static archive must link cleanly into a plain C program
          # without any extra C++ runtime flags.
          nix develop -c cc -o /tmp/test_static /tmp/test_libghostty_vt.c \
            $(pkg-config --cflags libghostty-vt) \
            "$PWD/zig-out/lib/libghostty-vt.a" \
            $(pkg-config --libs-only-l --static libghostty-vt | sed 's/-lghostty-vt//')
          /tmp/test_static
          # Verify it doesn't depend on the shared lib or a C++ runtime.
          ! ldd /tmp/test_static 2>/dev/null | grep -qE 'libghostty-vt|libc\+\+|libc\+\+abi'

      # Test system integration: rebuild with -Dsystem-simdutf=true so
      # simdutf comes from the system instead of being vendored. This
      # verifies the .pc file uses Requires.private for system deps and
      # the fat archive only bundles the remaining vendored deps.
      - name: Rebuild with system simdutf
        run: |
          rm -rf zig-out
          nix develop -c zig build -Demit-lib-vt -fsys=simdutf

      - name: Verify pkg-config with system simdutf
        run: |
          export PKG_CONFIG_PATH="$PWD/zig-out/share/pkgconfig"
          pc_content=$(cat zig-out/share/pkgconfig/libghostty-vt.pc)
          echo "$pc_content"

          # Requires.private must reference simdutf
          echo "$pc_content" | grep -q 'Requires.private:.*simdutf'

          # Requires.private must NOT reference libhwy (still vendored)
          ! echo "$pc_content" | grep -q 'Requires.private:.*libhwy'

      - name: Verify archive with system simdutf
        run: |
          # simdutf symbols must NOT be defined (comes from system)
          ! nm -g zig-out/lib/libghostty-vt.a | grep -q ' T .*simdutf'

          # highway symbols must still be defined (vendored)
          nm -g zig-out/lib/libghostty-vt.a | grep -q ' T .*3hwy'

  build-flatpak:
    strategy:
      fail-fast: false
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build with Flatpak
        run: |
          nix develop -c \
            zig build \
            -Dflatpak

  build-snap:
    strategy:
      fail-fast: false
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build with Snap
        run: |
          nix develop -c \
            zig build \
            -Dsnap

  build-libghostty-vt:
    strategy:
      matrix:
        target: [
            aarch64-macos,
            x86_64-macos,
            aarch64-linux,
            x86_64-linux,
            x86_64-linux-musl,
            aarch64-freebsd,
            x86_64-freebsd,
            x86_64-windows-gnu,
            # x86_64-windows-msvc is built natively in
            # build-libghostty-vt-windows since it needs the MSVC toolchain
            # and Windows SDK to be installed.
          ]
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build
        run: |
          nix develop -c zig build -Demit-lib-vt \
            -Dtarget=${{ matrix.target }}

  build-libghostty-vt-freestanding:
    strategy:
      matrix:
        include:
          - target: riscv32-freestanding-eabi
            cpu: baseline
          - target: thumb-freestanding-eabi
            cpu: cortex_m4
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build
        run: |
          nix develop -c zig build -Demit-lib-vt \
            -Dtarget=${{ matrix.target }} \
            -Dcpu=${{ matrix.cpu }} \
            -Doptimize=ReleaseSafe

  build-libghostty-vt-wasm:
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build fast WASM
        run: |
          nix develop -c zig build \
            -Demit-lib-vt \
            -Dtarget=wasm32-freestanding \
            -Doptimize=fast

      - name: Optimize fast WASM
        run: |
          nix develop -c wasm-opt -O3 --strip-dwarf \
            --enable-simd \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-nontrapping-float-to-int \
            --enable-multivalue \
            --enable-reference-types \
            zig-out/bin/ghostty-vt.wasm \
            -o ghostty-vt.wasm

      - name: Build ReleaseSmall WASM
        run: |
          nix develop -c zig build \
            -Demit-lib-vt \
            -Dtarget=wasm32-freestanding \
            -Doptimize=ReleaseSmall

      - name: Validate WASM ABI manifest
        run: |
          nix develop -c zig build test-lib-vt-schema \
            -Dtarget=wasm32-freestanding \
            -Doptimize=ReleaseSmall

      - name: Optimize ReleaseSmall WASM
        run: |
          nix develop -c wasm-opt -O3 \
            --enable-simd \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-nontrapping-float-to-int \
            --enable-multivalue \
            --enable-reference-types \
            zig-out/bin/ghostty-vt.wasm \
            -o ghostty-vt-small.wasm

      - name: Verify WASM simd128
        run: |
          # wasm-tools names the simd128 proposal "simd". The artifact must
          # fail validation when that feature is disabled.
          for artifact in ghostty-vt.wasm ghostty-vt-small.wasm; do
            nix develop -c wasm-tools validate "${artifact}"
            if nix develop -c wasm-tools validate \
              --features=-simd "${artifact}"; then
              echo "${artifact} unexpectedly validates with simd128 disabled" >&2
              exit 1
            fi
            echo "Verified ${artifact} requires simd128"
          done

      - name: Test WASM allocator
        run: |
          nix develop -c node test/wasm-alloc.mjs ghostty-vt.wasm
          nix develop -c node test/wasm-alloc.mjs ghostty-vt-small.wasm

  # Compile-only checks for the -Dvt-features flags so that future changes
  # don't regress any feature combination.
  build-libghostty-vt-features:
    runs-on: namespace-profile-ghostty-sm
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Compile feature flag matrix
        run: |
          features="snapshot formatter selection render_state input_encode color grid_introspection glyph_protocol kitty_graphics"
          configs="-all"
          for f in $features; do configs="$configs -all,+$f"; done

          for cfg in $configs; do
            echo "::group::-Dvt-features=$cfg"
            # The wasm lib build compiles the C API export block; the
            # test build compiles every module test without running any.
            nix develop -c zig build -Demit-lib-vt \
              "-Dvt-features=$cfg" \
              -Dtarget=wasm32-freestanding
            nix develop -c zig build test-lib-vt-build \
              "-Dvt-features=$cfg"
            echo "::endgroup::"
          done

  # lib-vt requires macOS runner for macOS/iOS builds because it requires the `apple_sdk` path
  build-libghostty-vt-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-macos
            platform: 1
            arch: arm64
            expect_encryption: false
          - target: x86_64-macos
            platform: 1
            arch: x86_64
            expect_encryption: false
          - target: aarch64-ios
            platform: 2
            arch: arm64
            expect_encryption: true
          - target: aarch64-ios-simulator
            platform: 7
            arch: arm64
            expect_encryption: false
    runs-on: namespace-profile-ghostty-macos-golden
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /Users/runner/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /Users/runner/zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: |
            xcode
          path: |
            /Users/runner/zig

      # TODO(tahoe): https://github.com/NixOS/nix/issues/13342
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Xcode Select
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Build
        run: |
          nix develop -c zig build -Demit-lib-vt \
            -Dtarget=${{ matrix.target }}

      - name: Verify Apple dylib
        run: |
          nix develop -c nu .github/scripts/check-apple-libghostty-vt.nu \
            zig-out/lib/libghostty-vt.dylib \
            --expect-platform ${{ matrix.platform }} \
            --expect-arch ${{ matrix.arch }} \
            ${{ matrix.expect_encryption && '--expect-encryption' || '' }}

  # lib-vt requires the Android NDK for Android builds
  build-libghostty-vt-android:
    strategy:
      matrix:
        target:
          [aarch64-linux-android, x86_64-linux-android, arm-linux-androideabi]
    runs-on: namespace-profile-ghostty-sm
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
      ANDROID_NDK_VERSION: r29
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false
          link-to-sdk: false
          local-cache: true

      - name: Build
        run: |
          nix develop -c zig build -Demit-lib-vt \
            -Dtarget=${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

  build-libghostty-vt-windows:
    runs-on: namespace-profile-ghostty-windows
    timeout-minutes: 45
    needs: build-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Test libghostty-vt
        run: zig build test-lib-vt

      - name: Build libghostty-vt
        run: zig build -Demit-lib-vt

      - name: Test static linking
        working-directory: example/c-vt-static
        run: zig build

      # Run the example directly rather than through `zig build run`, so
      # the DLL is loaded the way an embedder would load it.
      - name: Build dynamic linking example
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          zig build
          # setup-zig moves the local cache out of the project directory.
          $cache = if ($env:ZIG_LOCAL_CACHE_DIR) { $env:ZIG_LOCAL_CACHE_DIR } else { ".zig-cache" }
          Get-ChildItem $cache -Recurse -Filter ghostty-vt.dll |
            Sort-Object LastWriteTime |
            Select-Object -Last 1 |
            Copy-Item -Destination zig-out/bin

      # pwsh reports the full NTSTATUS; `zig build run` and Git Bash
      # truncate it to 8 bits.
      - name: Test dynamic linking
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          ./zig-out/bin/c_vt_effects.exe
          $code = $LASTEXITCODE
          "exit code: 0x{0:X8}" -f $code
          exit $code

      # Link and run against the MSVC-built DLL, which needs the CRT
      # libraries from the Windows SDK.
      - name: Build dynamic linking example (x86_64-windows-msvc)
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue zig-out
          zig build -Dtarget=x86_64-windows-msvc
          $cache = if ($env:ZIG_LOCAL_CACHE_DIR) { $env:ZIG_LOCAL_CACHE_DIR } else { ".zig-cache" }
          Get-ChildItem $cache -Recurse -Filter ghostty-vt.dll |
            Sort-Object LastWriteTime |
            Select-Object -Last 1 |
            Copy-Item -Destination zig-out/bin

      - name: Test dynamic linking (x86_64-windows-msvc)
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          ./zig-out/bin/c_vt_effects.exe
          $code = $LASTEXITCODE
          "exit code: 0x{0:X8}" -f $code
          exit $code

  # The x86_64 build is build-gate.
  build-linux:
    runs-on: namespace-profile-ghostty-md-arm64
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Test Build
        run: nix develop -c zig build

  build-linux-libghostty:
    runs-on: namespace-profile-ghostty-md
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Libghostty
        run: nix develop -c zig build -Dapp-runtime=none

  build-nix-ghostty:
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-ghostty-md, namespace-profile-ghostty-md-arm64]
        variant:
          - optimize: releasefast
            version: ".fast"
            # Release builds must be stripped.
            symbols: "no symbols"
          - optimize: debug
            version: ".debug"
            # Debug builds must not be stripped.
            symbols: "main_ghostty.main"
    name: build-nix ghostty-${{ matrix.variant.optimize }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig
            /home/runner/.cache/nix

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Test NixOS package build
        run: nix build .#ghostty-${{ matrix.variant.optimize }}

      - name: Check version
        run: result/bin/ghostty +version | grep -q '${{ matrix.variant.version }}'

      - name: Check symbols
        run: nm result/bin/.ghostty-wrapped 2>&1 | grep -q '${{ matrix.variant.symbols }}'

  build-nix-lib-vt:
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-ghostty-md, namespace-profile-ghostty-md-arm64]
        variant:
          - releasefast
          - releasefast-no-simd
          - debug
          - debug-no-simd
    name: build-nix libghostty-vt-${{ matrix.variant }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig
            /home/runner/.cache/nix

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # One invocation so the flake is evaluated once and the test
      # derivations build in parallel.
      - name: Test libghostty-vt build
        env:
          PKG: libghostty-vt-${{ matrix.variant }}
        run: |
          nix build \
            ".#$PKG" \
            ".#$PKG.tests.sanity-check" \
            ".#$PKG.tests.pkg-config" \
            ".#$PKG.tests.build-with-shared" \
            ".#$PKG.tests.build-with-static" \
            ".#$PKG.tests.build-example-c-vt-build-info"

  build-dist:
    runs-on: namespace-profile-ghostty-sm
    needs: build-gate
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Source Tarball
        run: |
          rm -rf zig-out/dist
          nix develop -c zig build dist
          cp zig-out/dist/*.tar.gz ghostty-source.tar.gz

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-tarball
          path: |-
            ghostty-source.tar.gz

  # Builds the tarball again and runs the tests from inside it. build-dist
  # only builds the tarball so the jobs that use it don't wait on this.
  test-dist:
    runs-on: namespace-profile-ghostty-md
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
