      - name: Check Source Tarball
        run: nix develop -c zig build distcheck

  build-dist-lib-vt:
    runs-on: namespace-profile-ghostty-sm
    needs: build-gate
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and Check Source Tarball
        run: |
          rm -rf zig-out/dist
          nix develop -c zig build distcheck -Demit-lib-vt=true

      - name: Verify tarball size
        run: |
          tarball=$(ls zig-out/dist/*.tar.gz)
          size=$(stat --format=%s "$tarball")
          max=$((5 * 1024 * 1024))
          echo "Tarball size: $size bytes (max: $max)"
          if [ "$size" -gt "$max" ]; then
            echo "ERROR: tarball exceeds 5 MB"
            exit 1
          fi

