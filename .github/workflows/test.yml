            xcode
          path: |
            /Users/runner/zig

      # TODO(tahoe): https://github.com/NixOS/nix/issues/13342
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Xcode Select
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Xcode Version
        run: xcodebuild -version

      - name: get the Zig deps
        id: deps
        run: nix build -L .#deps && echo "deps=$(readlink ./result)" >> $GITHUB_OUTPUT

      # We run tests with an empty test filter so it runs all unit tests
      # but skips Xcode tests
      - name: Test All
        run: |
          nix develop -c zig build test --system ${{ steps.deps.outputs.deps }} -Drenderer=metal -Dfont-backend=coretext_freetype -Dtest-filter=""

      - name: Build All
        run: |
          nix develop -c zig build --system ${{ steps.deps.outputs.deps }} -Demit-macos-app=false -Drenderer=metal -Dfont-backend=coretext_freetype

  # A quick x86_64 Linux build that expensive jobs wait on so we don't
  # pay for them when Ghostty doesn't even compile. Cheap jobs only
  # need skip. This also serves as our x86_64 Linux build check.
  build-gate:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-md
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Test Build
        run: nix develop -c zig build

  test:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-md
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: test
        run: nix develop -c zig build -Dapp-runtime=none test

      - name: Test GTK Build
        run: nix develop -c zig build -Dapp-runtime=gtk -Demit-docs -Demit-webdata

        # NOTE: This used to point to the Zig global cache directory before
        # 0.16.0. Now, the cache directory exclusively stores "minified"
        # archives of each dependency (i.e., only the paths defined in
        # build.zig.zon), and an uncompressed, working copy is stored in
        # PROJECT_ROOT/zig-pkg. The zig-pkg directory is warmed up during the
        # regular fetching process from the global cache directory if
        # possible.
        #
        # Nothing else should change; zon2nix's store path mimics what a
        # zig-pkg directory should look like, so actual build steps should be
        # fine, it's just here where we assume that all dependencies have been
        # downloaded, and we want to test the validity of the package
        # directory, do we need to have it pointing to zig-pkg and not the
        # zon2nix store path.
        #
        # Note that this can also be attempted by running:
        #   zig build --fetch=needed
        #
        # Note that --system PKGDIR should not be added to this invocation as
        # it disables fetching altogether (even, seemingly, from the local
        # cache).
      - name: Test System Build
        run: nix develop -c zig build --system "$(realpath zig-pkg)"

  test-lib-vt:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-md
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Test
        run: nix develop -c zig build test-lib-vt

      - name: Validate native ABI manifest
        run: nix develop -c zig build test-lib-vt-schema

  # Runs the libghostty-vt tests on FreeBSD 15.1 amd64, in a QEMU virtual
  # machine (VM). A container cannot run FreeBSD, because containers share
  # the host's Linux kernel. Namespace's Linux runners have KVM, Linux's
  # hardware virtualization, so the VM runs at close to native speed. The
  # tests are built for FreeBSD in the dev shell and copied into the VM,
  # which has no Zig toolchain.
  #
  # Three caches keep later runs fast. /zig holds Zig's build cache, so an
  # unchanged test binary is not rebuilt. /nix holds QEMU and the dev shell.
  # /freebsd-vm holds the FreeBSD image and the VM's set-up disk, so only the
  # first run downloads FreeBSD and waits for its first boot.
  #
  # .github/scripts/freebsd-vm/vm.sh does the work. Its help text explains
  # how to run the same steps on your own computer.
  test-lib-vt-freebsd:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-md
    timeout-minutes: 45
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
      GHOSTTY_FREEBSD_VM_ARCH: amd64
      GHOSTTY_FREEBSD_VM_RELEASE: "15.1"
      GHOSTTY_FREEBSD_VM_DIR: /freebsd-vm
      # Set here rather than left to the script's default, so a change to
      # the default does not silently change CI.
      GHOSTTY_FREEBSD_VM_TEST_TIMEOUT: "1800"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig
            /freebsd-vm

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # vm.sh quietly falls back to software emulation when it cannot use
      # KVM, which would make this job many times slower. Fail early
      # instead. The VM gets every CPU and three quarters of the runner's
      # memory, leaving the rest for QEMU itself and the host.
      - name: Check KVM and size the VM
        run: |
          if [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          if [ ! -w /dev/kvm ]; then
            echo "::error title=No KVM::/dev/kvm is missing or not writable"
            exit 1
          fi
          mem_mib=$(awk '/^MemTotal:/ { print int($2 / 1024) }' /proc/meminfo)
          echo "GHOSTTY_FREEBSD_VM_CPUS=$(nproc)" >> "$GITHUB_ENV"
          echo "GHOSTTY_FREEBSD_VM_MEMORY=$((mem_mib * 3 / 4))" >> "$GITHUB_ENV"
          echo "runner: $(nproc) CPUs, $mem_mib MiB"

      # Builds ghostty-vt-c-test into zig-out/bin, where vm.sh test looks
      # for it. It runs every libghostty-vt test, the Zig ones included.
      - name: Build the test binary
        run: |
          nix develop -c zig build test-lib-vt-build \
            -Demit-lib-vt \
            -Demit-test-exe \
            -Dtarget=x86_64-freebsd

      # setup does nothing once the cache volume holds a set-up VM. reset
      # then undoes whatever the last run's tests left on the VM's disk.
      - name: Set up the VM
        run: |
          nix develop -c .github/scripts/freebsd-vm/vm.sh setup
          nix develop -c .github/scripts/freebsd-vm/vm.sh reset

      - name: Start the VM
        run: nix develop -c .github/scripts/freebsd-vm/vm.sh start

      - name: Test on FreeBSD
        run: nix develop -c .github/scripts/freebsd-vm/vm.sh test

      # Shut down from inside the VM, even after a failure, so the disk on
      # the cache volume is never saved half written.
      - name: Stop the VM
        if: ${{ always() }}
        run: nix develop -c .github/scripts/freebsd-vm/vm.sh stop

  # Runs esctest against libghostty-vt. Report-only: many tests fail today,
  # so this never fails and isn't in the required checks. See
  # test/esctest/README.md.
  test-esctest:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-sm
    continue-on-error: true
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            /nix
            /zig

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run esctest
        working-directory: test/esctest
        run: nix develop -c zig build run > esctest.log || true

      - name: Summarize
        if: always()
        working-directory: test/esctest
        run: |
          {
            echo '## esctest'
            echo
            grep 'tests passed' esctest.log || echo 'esctest wrote no summary.'
            echo
            echo '<details><summary>Failing tests</summary>'
            echo
            echo '```'
            sed -n '/^Failing tests:$/,$p' esctest.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esctest-log
          path: test/esctest/esctest.log
          if-no-files-found: ignore

  test-kaitai:
    if: github.repository == 'ghostty-org/ghostty' && needs.skip.outputs.skip != 'true'
    needs: skip
    runs-on: namespace-profile-ghostty-xsm
    steps:
